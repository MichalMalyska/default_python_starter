repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-json
      - id: pretty-format-json
        args: [--no-sort-keys, --autofix]
      - id: check-merge-conflict

  # Local hooks run the tool versions from uv.lock, so pre-commit, CI and
  # `make check` always agree.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: complexipy
        name: complexipy (cognitive complexity)
        entry: uv run complexipy
        language: system
        pass_filenames: false
        types: [python]
      - id: test-ratio
        name: test code size limit
        entry: uv run python scripts/check_test_ratio.py
        language: system
        pass_filenames: false
        types: [python]
