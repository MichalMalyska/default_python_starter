version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait before taking a new release, so broken releases get yanked first.
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 2
    assignees:
      - "MichalMalyska"
    commit-message:
      prefix: "deps"
    groups:
      # Dev tools in one PR. Auto-merged, majors included.
      dev-deps:
        dependency-type: "development"
      # Runtime packages in one PR. Auto-merged for minor and patch only.
      # Major updates come as separate PRs and need a human approval.
      deps:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    assignees:
      - "MichalMalyska"
    commit-message:
      prefix: "ci"
    groups:
      all-github-actions:
        patterns:
          - "*"
