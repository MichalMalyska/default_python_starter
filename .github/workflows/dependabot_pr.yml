name: Dependabot PR reviews

on: pull_request_target

permissions:
  pull-requests: write
  contents: write

jobs:
  review-dependabot-pr:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      # Dev dependencies merge at any version. Other dependencies merge for
      # minor and patch only. Each merges when CI passes.
      - name: Approve and auto-merge
        if: ${{ steps.metadata.outputs.dependency-group == 'dev-deps' || steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: |
          gh pr review "$PR_URL" --approve --body "Dev dependency, or a minor or patch update. Auto-merge is on; it merges when CI passes."
          gh pr merge --auto --squash "$PR_URL"

      - name: Flag major updates for review
        if: ${{ steps.metadata.outputs.dependency-group != 'dev-deps' && steps.metadata.outputs.update-type == 'version-update:semver-major' }}
        run: gh pr comment "$PR_URL" --body "Major update of a runtime dependency. Not approved and not set to auto-merge. Review the changelog before merging."
