name: Dependabot PR reviews

on: pull_request_target

permissions:
  pull-requests: write
  contents: write

jobs:
  review-dependabot-pr:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      # Patch and minor updates merge by themselves after CI passes.
      - name: Approve and auto-merge patch and minor updates
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        run: |
          gh pr review "$PR_URL" --approve --body "Patch or minor update. Auto-merge is on; it merges when CI passes."
          gh pr merge --auto --squash "$PR_URL"

      # Major updates wait for a person.
      - name: Flag major updates for review
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-major' }}
        run: gh pr comment "$PR_URL" --body "Major update. Not approved and not set to auto-merge. Review the changelog before merging."
